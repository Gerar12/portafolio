<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="&lt;G/&gt; gcoder.dev">
  <defs>
    <linearGradient id="brkt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <style>
      .gee { fill: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .gee { fill: #f8fafc; }
      }
    </style>
  </defs>

  <!-- left chevron < -->
  <polyline points="150,64 56,256 150,448" fill="none" stroke="url(#brkt)"
            stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- G -->
  <text class="gee" x="232" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="'Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace"
        font-weight="700" font-size="300">G</text>

  <!-- slash / -->
  <line x1="300" y1="456" x2="356" y2="56" stroke="url(#brkt)"
        stroke-width="46" stroke-linecap="round"/>

  <!-- right chevron > -->
  <polyline points="386,64 480,256 386,448" fill="none" stroke="url(#brkt)"
            stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
